[workspace]
members = ["src/libkrun", "src/krun_input", "tests/whpx_boot"]
exclude = ["examples/gtk_display"]
resolver = "2"

[profile.dev]
#panic = "abort"

[profile.release]
#panic = "abort"
lto = true

# Use local vm-memory fork with rawfd removed from defaults for Windows compat.
[patch.crates-io]
vm-memory = { path = "deps/vm-memory" }
